<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Steam Frame controllers: default roles of the buttons in Visual Pinball X, Steam Frame Edition</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .name { font-size: 16px; font-weight: 600; fill: #1f2328; }
      .role { font-size: 14px; fill: #57606a; }
      .side { font-size: 15px; font-weight: 600; fill: #d0d7de; letter-spacing: 2px; }
      .note { font-size: 13px; fill: #57606a; }
      .key { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .arrow { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .body { fill: #424a53; }
      .trigger { fill: #24292f; }
      .bumper { fill: #6e7781; }
      .grip { fill: #24292f; }
      .control { fill: #1f2328; stroke: #8c959f; stroke-width: 1.5; }
      .stick { fill: #32383f; }
    </style>
  </defs>

  <!-- Opaque card, so that the drawing reads the same in light and dark themes -->
  <rect x="1" y="1" width="1178" height="638" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- Left controller (the right one is its mirror image: x' = 1180 - x) -->
  <rect class="trigger" x="410" y="102" width="80" height="30" rx="10"/>
  <rect class="bumper" x="395" y="126" width="110" height="28" rx="10"/>
  <rect class="body" x="370" y="146" width="200" height="384" rx="70"/>
  <rect class="grip" x="362" y="320" width="16" height="150" rx="8"/>
  <circle class="control" cx="490" cy="240" r="36"/>
  <circle class="stick" cx="490" cy="240" r="22"/>
  <rect class="control" x="410" y="333" width="60" height="24" rx="4"/>
  <rect class="control" x="428" y="315" width="24" height="60" rx="4"/>
  <rect x="429" y="334" width="22" height="22" fill="#1f2328"/>
  <rect class="control" x="505" y="292" width="34" height="20" rx="10"/>
  <text class="side" x="470" y="500" text-anchor="middle">LEFT</text>

  <!-- Right controller -->
  <rect class="trigger" x="690" y="102" width="80" height="30" rx="10"/>
  <rect class="bumper" x="675" y="126" width="110" height="28" rx="10"/>
  <rect class="body" x="610" y="146" width="200" height="384" rx="70"/>
  <rect class="grip" x="802" y="320" width="16" height="150" rx="8"/>
  <circle class="control" cx="690" cy="240" r="36"/>
  <circle class="stick" cx="690" cy="240" r="22"/>
  <rect class="control" x="641" y="292" width="34" height="20" rx="10"/>
  <circle class="control" cx="740" cy="325" r="14"/><text class="key" x="740" y="330" text-anchor="middle">Y</text>
  <circle class="control" cx="710" cy="355" r="14"/><text class="key" x="710" y="360" text-anchor="middle">X</text>
  <circle class="control" cx="770" cy="355" r="14"/><text class="key" x="770" y="360" text-anchor="middle">B</text>
  <circle class="control" cx="740" cy="385" r="14"/><text class="key" x="740" y="390" text-anchor="middle">A</text>
  <text class="side" x="710" y="500" text-anchor="middle">RIGHT</text>

  <!-- Left labels -->
  <g text-anchor="end">
    <text class="name" x="300" y="78">Trigger</text>
    <text class="role" x="300" y="97">left flipper</text>
    <text class="name" x="300" y="146">Bumper</text>
    <text class="role" x="300" y="165">nudge left</text>
    <text class="name" x="300" y="216">Thumbstick</text>
    <text class="role" x="300" y="235">tilt: nudge · menu: up / down</text>
    <text class="role" x="300" y="253">click: align the view</text>
    <text class="name" x="300" y="296">View button</text>
    <text class="role" x="300" y="315">open the menu</text>
    <text class="name" x="300" y="362">D-pad</text>
    <text class="role" x="300" y="381">menu navigation</text>
    <text class="name" x="300" y="430">Grip</text>
    <text class="role" x="300" y="449">left magna-save</text>
  </g>
  <path class="arrow" d="M310,73 L407,113"/>
  <path class="arrow" d="M310,141 L392,140"/>
  <path class="arrow" d="M310,211 L451,236"/>
  <path class="arrow" d="M310,291 L502,301"/>
  <path class="arrow" d="M310,357 L407,346"/>
  <path class="arrow" d="M310,425 L359,405"/>

  <!-- Right labels -->
  <g text-anchor="start">
    <text class="name" x="880" y="78">Trigger</text>
    <text class="role" x="880" y="97">right flipper</text>
    <text class="name" x="880" y="146">Bumper</text>
    <text class="role" x="880" y="165">nudge right</text>
    <text class="name" x="880" y="216">Thumbstick</text>
    <text class="role" x="880" y="235">pull down and let go: plunger</text>
    <text class="role" x="880" y="253">click: launch ball</text>
    <text class="name" x="880" y="296">Menu button</text>
    <text class="role" x="880" y="315">quit the table (lobby)</text>
    <text class="name" x="880" y="352">B</text>
    <text class="role" x="880" y="371">insert a coin</text>
    <text class="name" x="880" y="410">A</text>
    <text class="role" x="880" y="429">start a game</text>
    <text class="name" x="880" y="476">Grip</text>
    <text class="role" x="880" y="495">right magna-save</text>
  </g>
  <path class="arrow" d="M870,73 L773,113"/>
  <path class="arrow" d="M870,141 L788,140"/>
  <path class="arrow" d="M870,211 L729,236"/>
  <path class="arrow" d="M870,291 L678,301"/>
  <path class="arrow" d="M870,347 L787,355"/>
  <path class="arrow" d="M870,405 L757,390"/>
  <path class="arrow" d="M870,471 L821,450"/>

  <text class="note" x="710" y="560" text-anchor="middle">X and Y: free, can be mapped</text>
  <text class="note" x="590" y="610" text-anchor="middle">In the menu: point at an item with a controller and click with its trigger. Schematic drawing, not to scale. The trigger is behind the bumper.</text>
</svg>
